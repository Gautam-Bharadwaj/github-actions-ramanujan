name: First Workflow
on: [push]

jobs:
  run-shell-commands:
    runs-on: ubuntu-latest
    steps:
      - name: echo a string
        run: echo "Hello World"
      - name: multiline script
        run: |
          node -v
          npm -v
        defaults:
          run:
            working-directory: backend
        steps:
          - name: Install Dependencies
            run: npm ci
  second-job:
    runs-on: ubuntu-latest
    steps:
      - name: echo printing my name
        run: echo "My name is Gautam Jha"
